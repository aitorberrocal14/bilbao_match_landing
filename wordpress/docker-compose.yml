# A throwaway WordPress to try the plugin for real — in a Codespace or on your
# own machine. Nothing here is meant for production.
#
#   cd wordpress
#   docker compose up -d
#
# Wait about a minute and open http://localhost:8000 (in a Codespace, port 8000
# appears under "Ports"). WordPress installs itself and activates the plugin.
#
#   user: admin   password: admin
#
# The plugin folder is mounted live, so any edit is picked up on reload.
# `docker compose down -v` removes everything, database included.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Follow whatever host the request arrived on. Without this WordPress
      # redirects to localhost and the Codespaces forwarded URL breaks.
      WORDPRESS_CONFIG_EXTRA: |
        if ( isset( $$_SERVER['HTTP_HOST'] ) ) {
            $$mbb_https = ( ! empty( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] )
                || ( ! empty( $$_SERVER['HTTPS'] ) && 'off' !== $$_SERVER['HTTPS'] );
            if ( $$mbb_https ) { $$_SERVER['HTTPS'] = 'on'; }
            define( 'WP_HOME', ( $$mbb_https ? 'https://' : 'http://' ) . $$_SERVER['HTTP_HOST'] );
            define( 'WP_SITEURL', WP_HOME );
        }
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_DISPLAY', true );
    volumes:
      - wp:/var/www/html
      # The plugin, mounted live from this repository.
      - ./match-bilbao-bizkaia:/var/www/html/wp-content/plugins/match-bilbao-bizkaia

  # Installs WordPress once and activates the plugin, so there is no wizard.
  setup:
    image: wordpress:cli
    depends_on:
      - wordpress
    user: "33:33"
    volumes:
      - wp:/var/www/html
      - ./match-bilbao-bizkaia:/var/www/html/wp-content/plugins/match-bilbao-bizkaia
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until wp core is-installed --allow-root 2>/dev/null || wp db check --allow-root 2>/dev/null; do
          echo "waiting for WordPress files and database…"; sleep 3;
        done
        wp core install --allow-root \
          --url=http://localhost:8000 \
          --title="Match Bilbao Bizkaia — test" \
          --admin_user=admin --admin_password=admin \
          --admin_email=test@example.com --skip-email || true
        wp plugin activate match-bilbao-bizkaia --allow-root || true
        wp rewrite structure '/%postname%/' --allow-root || true
        wp rewrite flush --allow-root || true
        echo "----------------------------------------------------------"
        echo " WordPress ready on http://localhost:8000  (admin / admin)"
        echo " Next: Match Bilbao Bizkaia → Import content → Import now"
        echo "----------------------------------------------------------"

volumes:
  db:
  wp:
