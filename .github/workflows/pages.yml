name: Deploy the site to GitHub Pages

# Publishes the static site (landing page + exhibitor pages) so it can be
# reviewed at a real URL. The WordPress plugin and the build scripts are left
# out of the published site.
#
# Before the first run, enable it once in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Note: on a private repository, GitHub Pages needs a paid plan. On the free
# plan the repository has to be public for Pages to publish.

on:
  push:
    branches:
      - main
      - claude/match-bilbao-2026-redesign-77pjwf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs are superseded, not cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets exhibitors _site/
          # Pages runs Jekyll unless told otherwise; nothing here needs it.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
