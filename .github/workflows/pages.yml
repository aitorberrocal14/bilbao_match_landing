name: Deploy the site to GitHub Pages

# Publishes the static site (landing page + exhibitor pages) so it can be
# reviewed at a real URL. The WordPress plugin and the build scripts are left
# out of the published site.
#
# Before the first run, enable it once in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Note: on a private repository, GitHub Pages needs a paid plan. On the free
# plan the repository has to be public for Pages to publish.

on:
  push:
    branches:
      - main
      - claude/match-bilbao-2026-redesign-77pjwf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs are superseded, not cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run first, because the address it reports is stamped into the pages.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Point the site at where it is being published
        # The repository carries the address of the final domain. A Pages
        # preview lives somewhere else, so the canonical link, the sharing
        # card and the sitemap are rewritten to the address of this
        # deployment — otherwise they would advertise a site that does not
        # exist yet, and the sharing image would 404.
        run: node tools/set-site-url.js "${{ steps.pages.outputs.base_url }}"

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -r assets exhibitors _site/
          # Pages runs Jekyll unless told otherwise; nothing here needs it.
          touch _site/.nojekyll

      - name: Check the site is whole
        # A deployment that quietly lost the exhibitor pages or the stylesheet
        # is worse than one that failed, so count what is about to go out.
        run: |
          set -e
          test -f _site/index.html
          test -f _site/assets/css/styles.css
          test -f _site/assets/img/social-card.jpg
          pages=$(ls _site/exhibitors/*.html | wc -l)
          echo "Exhibitor pages: $pages"
          test "$pages" -ge 39
          grep -q "${{ steps.pages.outputs.base_url }}" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
