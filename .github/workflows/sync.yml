name: Traer los expositores de la plataforma

# Consulta Meetmaps, actualiza la lista de expositores, regenera sus páginas y
# publica el resultado en el hosting. Sin que nadie toque nada.
#
# Existe porque el ordenador desde el que se gestiona la web está detrás de un
# proxy corporativo que bloquea el FTP y no permite instalar programas. Los
# servidores de GitHub no tienen ese problema: pueden llamar a la API y subir
# por FTP. Así que el trabajo se hace aquí.
#
# ---------------------------------------------------------------------------
# Antes de la primera ejecución, en
#   Settings → Secrets and variables → Actions → Secrets
#
#   MBB_API_KEY    la user_key de Meetmaps (pedidla de SOLO LECTURA)
#
# Y nada más: el endpoint y el identificador del evento están escritos abajo,
# porque no son credenciales y sin la clave no sirven de nada.
#
# Para que además publique, los tres del FTP que usa deploy.yml:
#   FTP_HOST, FTP_USER, FTP_PASSWORD
#
# Sin MBB_API_KEY el flujo avisa y para. No falla ni inventa nada.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Cada día a las 06:00 UTC — las 7 u 8 de la mañana en Bilbao según la
    # época del año. Las altas de la víspera están publicadas al empezar el día.
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Ensayo: llama a la plataforma y dice qué cambiaría, sin escribir ni
          publicar nada. Úsalo la primera vez, para comprobar que la conexión
          funciona sin tocar la web.
        type: boolean
        default: false
      allow_shrink:
        description: >-
          Permitir que la lista se reduzca a menos de la mitad. Hace falta la
          primera vez de verdad, al sustituir los expositores de prueba por los
          reales.
        type: boolean
        default: false

concurrency:
  group: hosting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La dirección y el identificador del evento están en el archivo; lo único
      # que falta por configurar es la clave, que es lo único que de verdad es
      # un secreto. Así que es la clave la que decide si esto puede ejecutarse.
      - name: ¿Está la clave de la plataforma?
        id: creds
        env:
          KEY: ${{ secrets.MBB_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MBB_API_KEY no está configurado en los secretos del repositorio. No se ha consultado nada."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Consultar la plataforma
        if: steps.creds.outputs.ready == 'true'
        env:
          # El endpoint de Meetmaps. Tampoco es un secreto: sin la clave no
          # devuelve nada. Un secreto o una variable con este nombre manda por
          # encima, por si algún día lo cambian.
          MBB_API_URL: ${{ secrets.MBB_API_URL || vars.MBB_API_URL || 'https://apiv1.meetmaps.com/api/v1/' }}
          MBB_API_KEY: ${{ secrets.MBB_API_KEY }}
          # El identificador de MATCHBILBAOBIZKAIA2026 en Meetmaps. No es un
          # secreto —es un número de evento, no una credencial— así que vive
          # aquí y no hay que crear un secreto para él. Si algún día cambia,
          # un secreto o una variable con este nombre tiene preferencia.
          MBB_EVENT_ID: ${{ secrets.MBB_EVENT_ID || vars.MBB_EVENT_ID || '15425' }}
        # La protección contra encogimiento está puesta a propósito: si la
        # plataforma responde con la mitad de expositores de los que hay
        # publicados, lo más probable es que algo haya ido mal en su lado, y
        # vaciar el directorio del evento sería peor que no actualizarlo.
        run: |
          node tools/sync-exhibitors.js \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      # Un ensayo no escribe nada, así que tampoco hay nada que reconstruir ni
      # que publicar: el flujo termina aquí con el informe en el registro.
      - name: Regenerar las páginas
        if: steps.creds.outputs.ready == 'true' && ! inputs.dry_run
        run: |
          node tools/build-exhibitors.js
          node tools/build-sitemap.js

      - name: ¿Ha cambiado algo?
        if: steps.creds.outputs.ready == 'true' && ! inputs.dry_run
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ningún cambio: la plataforma devuelve lo mismo que ya está publicado."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat | tail -5
          fi

      - name: Guardar el cambio en el repositorio
        if: steps.diff.outputs.changed == 'true'
        # Queda registrado qué día entró cada expositor, que es la única
        # memoria que habrá de cómo se fue llenando el directorio.
        run: |
          set -e
          total=$(grep -c '^    id: ' assets/js/data/exhibitors.js)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/js/data/exhibitors.js assets/img/exhibitors exhibitors sitemap.xml
          git commit -m "Expositores desde la plataforma: $total"
          git push

      # --- Publicar ---------------------------------------------------------

      - name: Preparar lo que se publica
        if: steps.diff.outputs.changed == 'true'
        run: node tools/build-upload.js --dir _site

      - name: Comprobar que está entero
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          test -f _site/index.html
          test -f _site/assets/css/styles.css
          test -f _site/admin/index.html
          test ! -f _site/admin/admin-config.php
          echo "Páginas de expositor: $(ls _site/exhibitors/*.html 2>/dev/null | wc -l)"

      - name: ¿Está configurado el hosting?
        if: steps.diff.outputs.changed == 'true'
        id: ftp
        env:
          HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP_HOST no está configurado. El cambio está en el repositorio pero no se ha publicado."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir al hosting
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/' }}
          dangerous-clean-slate: false
          # Cada línea es un patrón, así que aquí no van comentarios.
          exclude: |
            **/.git*
            **/.git*/**
            **/cgi-bin/**
            admin/admin-config.php
            **/.htpasswd
