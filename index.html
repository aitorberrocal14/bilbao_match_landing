    <!-- SI NO HAY JAVASCRIPT, ESTO ES LO QUE SE LEE.
         =====================================================================
         La portada se dibuja entera desde los archivos de datos, que es lo que
         permite editarla sin tocar el código. El precio es que, sin
         JavaScript, esta página se queda vacía: quince caracteres, «Skip to
         content» y nada más.

         Las páginas legales y la de aviso no tienen ese problema —su texto va
         escrito en el HTML— pero la portada sí, y dejarla en blanco no vale ni
         para un buscador viejo, ni para una red corporativa que bloquea
         scripts, ni para quien navega con ellos desactivados.

         Esto no intenta reproducir la portada: da lo imprescindible —qué es,
         cuándo, dónde, cómo inscribirse y a quién escribir— y se aparta en
         cuanto el navegador ejecuta una sola línea de JavaScript. -->
    <noscript>

    <!-- SECTION 2 — EL DESTINO, ANTES QUE EL EVENTO =====================
         La presentación de Bilbao y los vídeos van aquí, pegados a la portada
         y POR DELANTE de la agenda. Estaban detrás, dentro del bloque del
         evento, y eso los convertía en un apéndice suyo: parecían material de
         apoyo del programa en vez de lo que son.

         El orden importa porque cuenta otra historia. Quien llega quiere saber
         primero A DÓNDE va a ir —la ciudad, la costa, el destino— y solo
         después qué se hace allí cada día. Con la agenda delante, el destino
         quedaba como una nota al pie de un horario.

         Los vídeos van con la presentación: son el destino contado en imágenes
         en vez de en párrafos. El ancla #editions se conserva por si hay
         enlaces antiguos apuntando ahí. -->
    <section class="section section--tight" id="presentation" aria-label="Presentation of Bilbao">
      <div class="shell" data-mount="presentation"></div>
      <div class="shell" id="editions" data-mount="editions"></div>
    </section>

    <!-- SECTION 3 — EVENT PROGRAMME ====================================

         portada. Se quitó: sus tres bloques destacados subieron a la portada
         y su botón de calendario está ahora en la barra del programa.

         El id sigue siendo "event" a propósito. Es el destino de una entrada
         del menú y de los enlaces del pie, y cambiarlo rompería cualquier
         dirección con #event que alguien tenga guardada o haya compartido. -->
    <section class="section section--soft" id="event" aria-label="Event Programme">
