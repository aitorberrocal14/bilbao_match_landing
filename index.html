<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Bilbao Bizkaia 2026</title>
  <meta name="description" content="Match Bilbao Bizkaia 2026 — the professional meeting point of the Bilbao Bizkaia destination. 6–10 October 2026: four days of B2B meetings, destination knowledge and discovery for the international travel trade.">
  <meta name="theme-color" content="#ae0000">

  <!-- The absolute address of the published site. Sharing cards and the
       canonical link have to be absolute, so this one value has to be right;
       change it here and in the four lines below if the domain differs. -->
  <link rel="canonical" href="https://www.matchbilbaobizkaia.eus/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Match Bilbao Bizkaia">
  <meta property="og:locale" content="en_GB">
  <meta property="og:url" content="https://www.matchbilbaobizkaia.eus/">
  <meta property="og:title" content="Match Bilbao Bizkaia 2026">
  <meta property="og:description" content="The professional meeting point of the Bilbao Bizkaia destination. 6–10 October 2026.">
  <meta property="og:image" content="https://www.matchbilbaobizkaia.eus/assets/img/social-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Puppy in bloom in front of the titanium of the Guggenheim Museum Bilbao">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Match Bilbao Bizkaia 2026">
  <meta name="twitter:description" content="The professional meeting point of the Bilbao Bizkaia destination. 6–10 October 2026.">
  <meta name="twitter:image" content="https://www.matchbilbaobizkaia.eus/assets/img/social-card.jpg">

  <!-- Structured data. Keep the dates and the name in step with
       assets/js/data/site.js, which is what the page itself renders from. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BusinessEvent",
    "name": "Match Bilbao Bizkaia 2026",
    "description": "The professional meeting point of the Bilbao Bizkaia destination: four days of pre-scheduled B2B meetings, destination knowledge and guided discovery for the international travel trade.",
    "startDate": "2026-10-06",
    "endDate": "2026-10-10",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "inLanguage": "en",
    "isAccessibleForFree": false,
    "url": "https://www.matchbilbaobizkaia.eus/",
    "image": "https://www.matchbilbaobizkaia.eus/assets/img/social-card.jpg",
    "location": {
      "@type": "Place",
      "name": "Bilbao, Bizkaia",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bilbao",
        "addressRegion": "Bizkaia",
        "addressCountry": "ES"
      }
    },
    "organizer": {
      "@type": "Organization",
      "name": "Bilbao Bizkaia",
      "url": "https://www.bilbaoturismo.net/",
      "email": "welcome@matchbilbaobizkaia.eus"
    },
    "audience": {
      "@type": "BusinessAudience",
      "name": "International travel trade: buyers, tour operators and media"
    }
  }
  </script>

  <link rel="icon" href="assets/img/brand/bilbao-bizkaia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- HEADER ============================================================ -->
  <header class="header" id="header" data-menu="closed" data-mount="header"></header>

  <main id="main">
    <!-- SECTION 1 — HERO / HOME ========================================= -->
    <section class="hero" id="home" aria-label="Match Bilbao Bizkaia 2026" data-mount="hero"></section>

    <!-- SECTION 2 — EL DESTINO, ANTES QUE EL EVENTO =====================
         La presentación de Bilbao y los vídeos van aquí, pegados a la portada
         y POR DELANTE de la agenda. Estaban detrás, dentro del bloque del
         evento, y eso los convertía en un apéndice suyo: parecían material de
         apoyo del programa en vez de lo que son.

         El orden importa porque cuenta otra historia. Quien llega quiere saber
         primero A DÓNDE va a ir —la ciudad, la costa, el destino— y solo
         después qué se hace allí cada día. Con la agenda delante, el destino
         quedaba como una nota al pie de un horario.

         Los vídeos van con la presentación: son el destino contado en imágenes
         en vez de en párrafos. El ancla #editions se conserva por si hay
         enlaces antiguos apuntando ahí. -->
    <section class="section section--tight" id="presentation" aria-label="Presentation of Bilbao">
      <div class="shell" data-mount="presentation"></div>
      <div class="shell" id="editions" data-mount="editions"></div>
    </section>

    <!-- SECTION 3 — MATCH BILBAO BIZKAIA 2026 ==========================
         3a · Introduction   3b · Event Programme                      -->
    <!-- The introduction and the programme are one block: the programme is
         the centre of gravity of the page and needs the weight. -->
    <section class="section section--soft" id="event" aria-label="Match Bilbao Bizkaia 2026">
      <div class="shell" data-mount="event"></div>
      <div class="shell" id="programme" data-mount="programme"></div>
    </section>

    <!-- SECTION 4 — MEET BB'S EXPERTS (+ exhibitor directory) =========== -->
    <section class="section" id="experts" aria-label="Meet BB's Experts">
      <div class="shell shell--wide" data-mount="experts"></div>
    </section>

    <!-- SECTION 5 — DISCOVER (English brochures) ======================== -->
    <section class="section section--soft" id="discover" aria-label="Discover Bilbao Bizkaia">
      <div class="shell" data-mount="discover"></div>
    </section>

    <!-- SECTION 6 — CONTACT ============================================= -->
    <section class="section" id="contact" aria-label="Contact">
      <div class="shell" data-mount="contact"></div>
    </section>
  </main>

  <!-- FOOTER ============================================================ -->
  <footer class="footer" id="footer" data-mount="footer"></footer>

  <!-- BROCHURE MODAL ==================================================== -->
  <div class="modal" id="modal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__box">
      <div class="modal__head">
        <h3 id="modal-title">Brochure</h3>
        <button class="modal__close" type="button" aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 3 10 10M13 3 3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__foot" id="modal-foot"></div>
    </div>
  </div>

  <!-- DATA LAYER — edit these files to update the site content =========== -->
  <script src="assets/js/data/site.js"></script>
  <script src="assets/js/data/content.js"></script>
  <script src="assets/js/data/programme.js"></script>
  <script src="assets/js/data/exhibitors.js"></script>
  <script src="assets/js/data/discover.js"></script>

  <!-- COMPONENTS + APP -->
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
