  <main id="main">

    <!-- SI NO HAY JAVASCRIPT, ESTO ES LO QUE SE LEE.
         =====================================================================
         La portada se dibuja entera desde los archivos de datos, que es lo que
         permite editarla sin tocar el código. El precio es que, sin
         JavaScript, esta página se queda vacía: quince caracteres, «Skip to
         content» y nada más.

         Las páginas legales y la de aviso no tienen ese problema —su texto va
         escrito en el HTML— pero la portada sí, y dejarla en blanco no vale ni
         para un buscador viejo, ni para una red corporativa que bloquea
         scripts, ni para quien navega con ellos desactivados.

         Esto no intenta reproducir la portada: da lo imprescindible —qué es,
         cuándo, dónde, cómo inscribirse y a quién escribir— y se aparta en
         cuanto el navegador ejecuta una sola línea de JavaScript. -->
    <noscript>
      <section class="section">
        <div class="shell legal">
          <p class="kicker">6 – 10 October 2026 · Bilbao, Basque Country</p>
          <h1 class="h-1">Match Bilbao Bizkaia 2026</h1>
          <p class="lead measure">
            The official professional meeting point of the Bilbao Bizkaia
            destination: four days of pre-scheduled B2B meetings between the
            international travel trade and the basque companies that design,
            host and deliver the Bilbao Bizkaia experience.
          </p>
          <p class="measure">
            <strong>This page needs JavaScript to show the full programme, the
            exhibitor directory and the brochures.</strong> Everything you need
            in order to take part is below.
          </p>
          <ul>

            <li>

            </li>
            <li><strong>Telephone:</strong> +34 944 205 377 (Monday to Friday, 9:00 – 15:00 CET)</li>
          </ul>
          <p class="measure">
            <a class="link-red" href="privacy.html">Privacy policy</a> ·
            <a class="link-red" href="cookies.html">Cookie policy</a> ·

            <a class="link-red" href="accessibility.html">Accessibility</a>
          </p>
        </div>
      </section>
    </noscript>

    <!-- SECTION 1 — HERO / HOME ========================================= -->
    <section class="hero" id="home" aria-label="Match Bilbao Bizkaia 2026" data-mount="hero"></section>

    <!-- SECTION 2 — LOS VÍDEOS =========================================
         Estaban colgando de la presentación del destino, como un apartado
         suyo. Son otra cosa: el evento contado en imágenes, y lo que mejor
         explica de qué va esto a quien no ha estado nunca.

         Van justo debajo de la portada porque es lo primero que alguien quiere
         ver, y porque un vídeo es lo que hace bajar. La portada termina en las
         cifras; aquí hay dos carátulas grandes y un pie que invita a seguir.

         Entre la portada y esto hubo un rato una banda gris con los cuatro
         pasos de "cómo funciona". Está en platform.html, que es donde va a
         parar quien pulsa Login antes de que abra la plataforma: allí la
         pregunta "¿y esto cómo funciona?" es la que de verdad se hace alguien,
         y aquí lo que se quiere ver primero es el evento, no un diagrama. -->
    <section class="section" id="editions" aria-label="Latest editions">
      <div class="shell" data-mount="editions"></div>
    </section>

    <!-- SECTION 3 — EL DESTINO, ANTES QUE EL EVENTO =====================
         La presentación de Bilbao va POR DELANTE de la agenda. Estaba detrás,
         dentro del bloque del evento, y eso la convertía en un apéndice suyo:
         parecía material de apoyo del programa en vez de lo que es.

         El orden importa porque cuenta otra historia. Quien llega quiere saber
         primero A DÓNDE va a ir —la ciudad, la costa, el destino— y solo
         después qué se hace allí cada día. Con la agenda delante, el destino
         quedaba como una nota al pie de un horario. -->
    <section class="section section--tight" id="presentation" aria-label="Bilbao Bizkaia">
      <div class="shell" data-mount="presentation"></div>
    </section>

    <!-- SECTION 3 — EVENT PROGRAMME ====================================
         Aquí había además una introducción que repetía lo que ya dice la
         portada. Se quitó: sus tres bloques destacados subieron a la portada
         y su botón de calendario está ahora en la barra del programa.

         El id sigue siendo "event" a propósito. Es el destino de una entrada
         del menú y de los enlaces del pie, y cambiarlo rompería cualquier
         dirección con #event que alguien tenga guardada o haya compartido. -->
    <section class="section section--soft" id="event" aria-label="Event Programme">
      <div class="shell" id="programme" data-mount="programme"></div>
    </section>

    <!-- SECTION 4 — MEET BB'S EXPERTS (+ exhibitor directory) =========== -->
    <section class="section" id="experts" aria-label="Meet BB's Experts">
